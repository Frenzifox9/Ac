<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LePixel — Galerie</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');:root{--paper:#f4f0e8;--ink:#24251f;--muted:#77786f;--line:#ded9ce;--green:#c8f169;--pink:#f5b7c8;--purple:#c8b9ff;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}body:before{content:'';display:block;height:8px;background:repeating-linear-gradient(90deg,var(--green) 0 26px,var(--pink) 26px 52px,var(--purple) 52px 78px)}header{max-width:1240px;margin:auto;padding:23px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font:700 1.2rem 'Space Grotesk',sans-serif;letter-spacing:-.7px}.brand:before{content:'▦';width:36px;height:36px;display:grid;place-items:center;background:var(--green);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:19px}.right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}main{max-width:1240px;margin:auto;padding:0 28px}.hero{padding:58px 0 42px;border-bottom:1px solid var(--line);margin-bottom:32px}h1{font:700 clamp(2.7rem,5vw,4.6rem)/1 'Space Grotesk',sans-serif;letter-spacing:-.065em;margin:0 0 16px}p{color:#66675e;line-height:1.7;margin:0}.btn{border:1.5px solid var(--ink);border-radius:7px;background:var(--ink);color:white;padding:12px 17px;font-weight:700;cursor:pointer;font-size:.91rem}.btn:hover{box-shadow:3px 3px 0 #77786f}.btn.secondary{background:var(--white);color:var(--ink)}.btn:disabled{opacity:.5;cursor:wait}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.card{min-width:0}.preview{height:220px;background:var(--white);border:1.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;overflow:hidden}.preview .symbol{font-size:65px}.cardbody{padding:14px 2px}.card h3{font:600 1.13rem 'Space Grotesk',sans-serif;margin:0 0 8px;overflow-wrap:anywhere}.card p{margin-bottom:12px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1.5px dashed var(--line);padding:60px 20px;text-align:center;background:var(--white)}.panel{background:var(--white);border:1.5px solid var(--ink);padding:28px;max-width:650px;margin:35px auto}.panel h2{font:700 2rem 'Space Grotesk',sans-serif;margin:0 0 12px}.field{margin:20px 0}.field label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}input{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:13px;font:inherit}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.notice{margin:20px 0;padding:13px 15px;border:1px solid var(--line);background:var(--white);color:#57584f;font-size:14px}.error{color:#a32a32}.hidden{display:none!important}.hint{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}a{color:inherit}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:17px 18px}main{padding:0 17px}.hero{padding:38px 0}h1{font-size:3rem}.cards{grid-template-columns:1fr}.preview{height:210px}.panel{padding:18px}}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}.metric{padding:20px;border:1.5px solid var(--ink);border-radius:7px;background:var(--paper);display:flex;flex-direction:column;gap:8px}.metric strong{font:700 2rem 'Space Grotesk',sans-serif}.metric span{font-size:13px;color:var(--muted)}.countdown{font:700 clamp(2rem,7vw,4rem) "Space Grotesk",sans-serif;letter-spacing:.04em;margin:20px 0}.closed-panel{text-align:center;max-width:700px}.closed-panel h1{font-size:clamp(2.2rem,6vw,3.5rem)}select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:10px}
/* Assistance et surveillance */
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.lp-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px}.lp-box h3{margin:0 0 8px;font-family:'Space Grotesk',sans-serif}.lp-small{font-size:13px;color:var(--muted)}.lp-status{display:inline-block;border-radius:20px;padding:5px 10px;background:var(--green);font-size:12px;font-weight:700}.lp-warn{background:#ffe2a8}.lp-danger{background:#ffd0d0}.lp-ticket{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--white)}.lp-ticket textarea{width:100%}.lp-ticket select{max-width:100%}.lp-messages{max-height:380px;overflow:auto}.lp-messages .notice{overflow-wrap:anywhere}
/* Notifications et journal de sécurité */
.lp-dot{display:inline-block;min-width:20px;padding:2px 6px;border-radius:12px;background:#c53939;color:white;font-size:12px;margin-left:5px}.lp-event{border-left:3px solid var(--purple);padding:12px;margin:12px 0;background:var(--paper)}

/* Profil membre */
.lp-profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0;padding:16px;border:1.5px solid var(--line);border-radius:9px;background:var(--white)}
.lp-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font:700 1.7rem 'Space Grotesk',sans-serif;overflow:hidden}
.lp-avatar img{width:100%;height:100%;object-fit:cover}
.lp-profile-info{flex:1;min-width:180px}
.lp-profile-info strong{font:700 1.15rem 'Space Grotesk',sans-serif}
.lp-profile-actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head>
<body><header><div class="brand">Le<b>Pixel</b></div><div class="right"><button id="createBtn" class="btn hidden" onclick="showCreate()">+ Créer</button><button id="loginBtn" class="btn secondary" onclick="showLogin()">Connexion admin</button><button id="lpBell" class="btn secondary hidden" onclick="showNotifications()">🔔 Notifications <span id="lpUnread" class="lp-dot hidden">0</span></button><button id="logoutBtn" class="btn secondary hidden" onclick="logout()">Déconnexion</button></div></header><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyBe6AvyeZJRBvzlpUcD-F44t_MG7Qrq0FE',authDomain:'lepixel-12572.firebaseapp.com',databaseURL:'https://lepixel-12572-default-rtdb.firebaseio.com',projectId:'lepixel-12572'};
const ADMIN_UID='2QwsY97xJVPpwwn0sf0vDNf7Qvh1';
const app=document.getElementById('app');let db,auth,entries=[],user=null,roles={},rolesLoaded=false;
function role(){return user&&(user.uid===ADMIN_UID?'admin':roles[user.uid]||'')} 
function isAdmin(){return role()==='admin'}
function canEdit(){return ['admin','editor'].includes(role())}
function canAccess(){return !!role()}
let lpSecurityEvents={},lpNotificationReads={},lpNotifItems=[],lpNotifRefs=[],lpSecurityReady=false;
let accountLabels={},permissions={},announcement={},stats={},activity=[],historyItems=[],scheduled={},shopClosure={active:false};
let closureTimer=null,closureLoaded=false,closureError=false;
let privateLoaded=false,privateAccess=false,authReady=false,ideas={},appearance={title:'Mes pixel arts',subtitle:'Choisis une création pour découvrir son pixel art.',accent:'#c8f169',banner:''},appearanceLoaded=false,ideasLoaded=false,scheduledLoaded=false;
function favorites(){try{return JSON.parse(localStorage.getItem('lepixel_favorites_v1')||'[]')}catch{return []}}
function toggleFavorite(id){const f=favorites();const n=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem('lepixel_favorites_v1',JSON.stringify(n));render()}
function validHex(v){return /^#[0-9a-fA-F]{6}$/.test(v||'')}
function applyAppearance(){document.documentElement.style.setProperty('--green',validHex(appearance.accent)?appearance.accent:'#c8f169')}
function countdownAt(at){const sec=Math.max(0,Math.ceil((Number(at)-Date.now())/1000));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),ss=sec%60;return (d?d+'j ':'')+[h,m,ss].map(v=>String(v).padStart(2,'0')).join(':')}
async function logLogin(){if(!auth.currentUser)return;try{await db.ref('loginEvents').push({uid:auth.currentUser.uid,email:auth.currentUser.email||'',at:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn('Journal de connexion indisponible:',e.message)}}
async function showLogins(){if(!isAdmin())return;app.innerHTML='<section class="panel"><h2>Connexions récentes</h2><p>Chargement…</p></section>';try{const snap=await db.ref('loginEvents').orderByChild('at').limitToLast(100).once('value');const items=Object.values(snap.val()||{}).sort((a,b)=>b.at-a.at);app.innerHTML=`<section class="panel" style="max-width:850px"><h2>Journal des connexions</h2><p class="hint">Connexions réussies depuis cette version du site. Pas d’adresse IP ni de mot de passe enregistré.</p>${items.map(x=>`<div class="notice"><b>${esc(x.email||x.uid)}</b><p>${x.at?new Date(x.at).toLocaleString('fr-FR'):'Date indisponible'}</p></div>`).join('')||'<p>Aucune connexion enregistrée.</p>'}<button class="btn" onclick="dashboard()">Retour</button></section>`}catch(e){app.innerHTML=`<section class="panel"><h2>Erreur</h2><p>${esc(e.message)}</p><button class="btn" onclick="dashboard()">Retour</button></section>`}}
function publicCardsHTML(){const fav=favorites();const cards=entries.map(e=>{const at=Number(scheduled[e.id]?.at||0);const upcoming=at>Date.now();return `<article class="card"><div class="preview"><span class="symbol">▦</span></div><div class="cardbody"><h3>${esc(e.name)}</h3>${upcoming?`<p>⏳ Disponible dans <strong class="release-countdown" data-at="${at}">${countdownAt(at)}</strong></p>`:''}<div class="actions">${upcoming?'':`<button class="btn" onclick="openEntry('${e.id}')">Voir le pixel art</button>`}<button class="btn secondary" onclick="toggleFavorite('${e.id}')" aria-label="Favori">${fav.includes(e.id)?'♥ Retirer des favoris':'♡ Favoris'}</button></div></div></article>`}).join('');return `<section class="hero"><h1>${esc(appearance.title||'Mes pixel arts')}</h1><p>${esc(appearance.subtitle||'Choisis une création pour découvrir son pixel art.')}</p>${appearance.banner?`<div class="notice">${esc(appearance.banner)}</div>`:''}${announcement.active?`<div class="notice">📢 ${esc(announcement.text)}</div>`:''}</section><div class="toolbar" style="margin-bottom:24px"><button class="btn secondary" onclick="showFavorites()">♥ Mes favoris (${fav.length})</button><button class="btn secondary" onclick="showIdeaForm()">💡 Proposer une idée</button><button class="btn secondary" onclick="showSupportForm()">🎧 Assistance</button><button class="btn secondary" onclick="showVisitorChat()">💬 Messagerie</button></div>${cards?`<section class="cards">${cards}</section>`:'<div class="empty">Aucun pixel art disponible</div>'}`}
function showFavorites(){if(!isShop())return;const fav=favorites(),matches=entries.filter(e=>fav.includes(e.id));app.innerHTML=`<section class="panel" style="max-width:850px"><h2>♥ Mes favoris</h2><p>Enregistrés uniquement sur cet appareil.</p>${matches.map(e=>`<div class="notice"><b>${esc(e.name)}</b><div class="toolbar"><button class="btn" onclick="openEntry('${e.id}')" ${Number(scheduled[e.id]?.at||0)>Date.now()?'disabled':''}>Ouvrir</button><button class="btn secondary" onclick="toggleFavorite('${e.id}');showFavorites()">Retirer</button></div></div>`).join('')||'<p>Aucun favori pour le moment.</p>'}<div class="toolbar"><button class="btn secondary" onclick="lpReturnShop()">Retour boutique</button></div></section>`}
function showIdeaForm(){if(!isShop()||lpBlocked)return;app.innerHTML=`<section class="panel"><h2>💡 Proposer un pixel art</h2><p>Ton idée sera examinée par les administrateurs. N'indique pas de données personnelles.</p><form id="ideaForm"><div class="field"><label for="ideaTitle">Ton idée</label><input id="ideaTitle" maxlength="90" required placeholder="Ex. Un renard dans la neige"></div><div class="field"><label for="ideaDesc">Description (facultative)</label><textarea id="ideaDesc" maxlength="400" rows="4" style="width:100%"></textarea></div><p class="error" id="ideaError"></p><div class="toolbar"><button class="btn">Envoyer mon idée</button><button class="btn secondary" type="button" onclick="lpReturnShop()">Retour</button></div></form></section>`;document.getElementById('ideaForm').onsubmit=async ev=>{ev.preventDefault();const title=document.getElementById('ideaTitle').value.trim(),description=document.getElementById('ideaDesc').value.trim();if(!title)return;const btn=ev.submitter;btn.disabled=true;try{await db.ref('ideas').push({visitorId:lpVisitor,title,description,status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});app.innerHTML='<section class="panel"><h2>Idée envoyée !</h2><p>Merci pour ta proposition.</p><button class="btn" onclick="lpReturnShop()">Retour boutique</button></section>'}catch(e){document.getElementById('ideaError').textContent='Envoi impossible : '+e.message;btn.disabled=false}}}
async function showIdeas(){if(!isAdmin())return home();app.innerHTML='<section class="panel"><h2>Boîte à idées</h2><p>Chargement…</p></section>';try{const snap=await db.ref('ideas').once('value');ideas=snap.val()||{};app.innerHTML=`<section class="panel" style="max-width:850px"><h2>Boîte à idées</h2><p>Propositions envoyées par les visiteurs.</p>${Object.entries(ideas).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).map(([id,v])=>`<div class="notice"><b>${esc(v.title)}</b><p>${esc(v.description||'')}</p>${/^[a-f0-9]{32}$/.test(v.visitorId||'')?`<button class="btn secondary" onclick="showAdminVisitorChat('${v.visitorId}')">💬 Contacter le visiteur</button>`:''}<p class="hint">Statut : ${esc(v.status||'pending')}</p><div class="toolbar"><button class="btn secondary" onclick="setIdeaStatus('${id}','accepted')">Accepter</button><button class="btn secondary" onclick="setIdeaStatus('${id}','rejected')">Refuser</button><button class="btn secondary" onclick="deleteIdea('${id}')">Supprimer</button></div></div>`).join('')||'<p>Aucune idée pour le moment.</p>'}<button class="btn" onclick="dashboard()">Retour</button></section>`}catch(e){app.innerHTML=`<section class="panel"><h2>Erreur de lecture</h2><p>${esc(e.message)}</p><button class="btn" onclick="dashboard()">Retour</button></section>`}}
async function setIdeaStatus(id,status){if(!isAdmin())return;try{await db.ref('ideas/'+id+'/status').set(status);showIdeas()}catch(e){alert(e.message)}}
async function deleteIdea(id){if(!isAdmin()||!confirm('Supprimer cette idée ?'))return;try{await db.ref('ideas/'+id).remove();showIdeas()}catch(e){alert(e.message)}}
function showAppearance(){if(!isAdmin())return home();app.innerHTML=`<section class="panel"><h2>🎨 Personnalisation</h2><p>Ces changements seront visibles par tous les visiteurs.</p><form id="appearanceForm"><div class="field"><label>Titre de la boutique</label><input id="appearanceTitle" maxlength="70" required></div><div class="field"><label>Sous-titre</label><textarea id="appearanceSubtitle" maxlength="200" rows="3" style="width:100%"></textarea></div><div class="field"><label>Message de bannière (facultatif)</label><input id="appearanceBanner" maxlength="180"></div><div class="field"><label>Couleur principale</label><input id="appearanceAccent" type="color" style="height:55px;padding:5px"></div><p id="appearanceError" class="error"></p><div class="toolbar"><button class="btn">Enregistrer</button><button type="button" class="btn secondary" onclick="dashboard()">Retour</button></div></form></section>`;document.getElementById('appearanceTitle').value=appearance.title||'Mes pixel arts';document.getElementById('appearanceSubtitle').value=appearance.subtitle||'';document.getElementById('appearanceBanner').value=appearance.banner||'';document.getElementById('appearanceAccent').value=validHex(appearance.accent)?appearance.accent:'#c8f169';document.getElementById('appearanceForm').onsubmit=async ev=>{ev.preventDefault();const data={title:document.getElementById('appearanceTitle').value.trim(),subtitle:document.getElementById('appearanceSubtitle').value.trim(),banner:document.getElementById('appearanceBanner').value.trim(),accent:document.getElementById('appearanceAccent').value};try{await db.ref('shopSettings/appearance').set(data);await lpSecurityLog('shop','Personnalisation modifiée','');alert('Personnalisation enregistrée');dashboard()}catch(e){document.getElementById('appearanceError').textContent=e.message}}}

const permLabels={create:'Créer',edit:'Modifier',delete:'Supprimer',schedule:'Programmer',announce:'Annonces',stats:'Statistiques',history:'Historique',activity:'Journal'};
function allowed(k){if(!user||String(role()).startsWith('suspended_'))return false;if(isAdmin())return true;if(permissions[user.uid]&&typeof permissions[user.uid][k]==='boolean')return permissions[user.uid][k];return role()==='editor'&&k==='edit'}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validLink(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)}catch{return false}}
const SHOP_HASH='#b';
function isShop(){return location.hash===SHOP_HASH}
function home(){history.replaceState(null,'',location.pathname+location.search);render()}
function shareShop(){const url=location.origin+location.pathname+SHOP_HASH;if(url.length>50){alert('L’adresse du site est trop longue pour un lien de 50 caractères ('+url.length+'). Publie cette application dans un dépôt au nom plus court.');return}navigator.clipboard?.writeText(url).then(()=>alert('Lien de la boutique copié !\n'+url)).catch(()=>prompt('Copie le lien de ta boutique :',url))||(!navigator.clipboard&&prompt('Copie le lien de ta boutique :',url))}

// === Visiteurs anonymes : identifiant local, aucune collecte d'adresse IP ===
function lpRandomId(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function lpVisitorId(){let id=localStorage.getItem('lepixel_visitor_id_v2');if(!/^[a-f0-9]{32}$/.test(id||'')){id=lpRandomId();localStorage.setItem('lepixel_visitor_id_v2',id)}return id}
const lpVisitor=lpVisitorId();let lpBlocked=false,lpVisitDone=false;
function lpVisitorTag(id){return String(id||'').slice(0,8)}
function lpVisitorBoot(){
 db.ref('blockedVisitors/'+lpVisitor).on('value',s=>{const before=lpBlocked;lpBlocked=s.val()===true;if(before!==lpBlocked&&isShop()){delete app.dataset.lpSubpage;render()}},e=>console.warn('Statut visiteur :',e.message));
}
function lpRecordVisit(){
 if(lpVisitDone||!isShop()||isAdmin())return;
 lpVisitDone=true;
 const session=lpRandomId();
 db.ref('visitorSessions/'+session).set({visitorId:lpVisitor,at:firebase.database.ServerValue.TIMESTAMP}).catch(e=>console.warn('Visite non enregistrée',e.message));
}
function lpVisitorBlockedHTML(){return `<section class="panel"><h2>Accès à la boutique suspendu</h2><p>Cet identifiant de navigateur est temporairement bloqué. Tu peux contacter l'équipe pour demander un réexamen.</p><p class="hint">Identifiant : ${esc(lpVisitorTag(lpVisitor))}…</p><div class="toolbar"><button class="btn secondary" onclick="showVisitorChat()">💬 Contacter l'équipe</button></div></section>`}
function lpVisitorNotice(){return `<p class="hint">LePixel utilise un identifiant anonyme enregistré dans ce navigateur pour permettre les réponses, les suspensions et le suivi des visites. Aucune adresse IP n'est collectée par cette fonctionnalité. Ne partage pas d'informations personnelles.</p>`}
function showVisitorChat(){
 app.innerHTML=`<section class="panel"><h2>💬 Messagerie LePixel</h2><p>Discute avec l'équipe. Reviens sur ce navigateur pour lire la réponse.</p>${lpVisitorNotice()}<p class="hint">Ton identifiant : ${esc(lpVisitorTag(lpVisitor))}…</p><div id="lpVisitorThread">Chargement…</div><form id="lpVisitorChatForm"><div class="field"><label for="lpVisitorMessage">Ton message</label><textarea id="lpVisitorMessage" maxlength="700" minlength="2" required rows="3" style="width:100%"></textarea></div><p class="error" id="lpVisitorChatError"></p><div class="toolbar"><button class="btn">Envoyer</button><button class="btn secondary" type="button" onclick="showVisitorChat()">Actualiser</button><button class="btn secondary" type="button" onclick="lpReturnShop()">Retour</button></div></form></section>`;
 db.ref('visitorChats/'+lpVisitor+'/messages').once('value').then(s=>{const box=document.getElementById('lpVisitorThread');if(!box)return;const msgs=Object.values(s.val()||{}).sort((a,b)=>(a.at||0)-(b.at||0));box.innerHTML=msgs.map(m=>`<div class="notice"><b>${m.by==='admin'?'Équipe LePixel':'Toi'}</b><p>${esc(m.text)}</p><p class="hint">${lpTime(m.at)}</p></div>`).join('')||'<p>Aucun message pour le moment.</p>'}).catch(e=>{const box=document.getElementById('lpVisitorThread');if(box)box.textContent='Lecture impossible : '+e.message});
 document.getElementById('lpVisitorChatForm').onsubmit=async e=>{e.preventDefault();const text=document.getElementById('lpVisitorMessage').value.trim();if(text.length<2)return;const btn=e.submitter;btn.disabled=true;try{await db.ref('visitorChats/'+lpVisitor+'/messages').push({by:'visitor',text,at:firebase.database.ServerValue.TIMESTAMP});showVisitorChat()}catch(err){document.getElementById('lpVisitorChatError').textContent=err.message;btn.disabled=false}};
}
async function showVisitorManagement(){
 if(!isAdmin())return home();app.innerHTML='<section class="panel"><h2>Visiteurs anonymes</h2><p>Chargement…</p></section>';
 try{const [vs,bs,cs]=await Promise.all([db.ref('visitorSessions').orderByChild('at').limitToLast(250).once('value'),db.ref('blockedVisitors').once('value'),db.ref('visitorChats').once('value')]);
 const visits=Object.values(vs.val()||{}),blocked=bs.val()||{},chats=cs.val()||{},all={};
 visits.forEach(v=>{if(!/^[a-f0-9]{32}$/.test(v.visitorId||''))return;const x=all[v.visitorId]||{count:0,at:0};x.count++;x.at=Math.max(x.at,Number(v.at)||0);all[v.visitorId]=x});
 Object.keys(chats).concat(Object.keys(blocked)).forEach(id=>{if(/^[a-f0-9]{32}$/.test(id)&&!all[id])all[id]={count:0,at:0}});
 const rows=Object.entries(all).sort((a,b)=>b[1].at-a[1].at);
 app.innerHTML=`<section class="panel" style="max-width:1000px"><h2>👥 Visiteurs et connexions</h2><p>Dernières 250 visites enregistrées, même sans compte. Un identifiant correspond à un navigateur, pas forcément à une personne. Aucune IP n'est affichée.</p>${rows.map(([id,v])=>`<div class="notice"><b>Visiteur ${esc(lpVisitorTag(id))}…</b> ${blocked[id]===true?'<span class="lp-status lp-danger">Suspendu</span>':''}<p class="hint">Identifiant : ${esc(id)}</p><p>${v.count} visite(s) dans l'historique · Dernière visite : ${lpTime(v.at)}</p><div class="toolbar"><button class="btn secondary" onclick="showAdminVisitorChat('${id}')">💬 Messagerie</button><button class="btn secondary" onclick="lpSetVisitorBlocked('${id}',${blocked[id]===true?'false':'true'})">${blocked[id]===true?'Réautoriser':'Suspendre'}</button></div></div>`).join('')||'<p>Aucune visite enregistrée.</p>'}<button class="btn" onclick="dashboard()">Retour</button></section>`;
 }catch(e){app.innerHTML=`<section class="panel"><h2>Erreur de lecture</h2><p>${esc(e.message)}</p><button class="btn" onclick="dashboard()">Retour</button></section>`}
}

function showMyProfile(){
 if(!user)return showLogin();
 app.innerHTML=`<section class="panel"><h2>👤 Mon profil</h2><p>Personnalise ton compte. Tes changements concernent uniquement ton profil.</p>
 <div class="lp-profile">${profileAvatarHTML()}<div class="lp-profile-info"><strong>${esc(profileDisplayName())}</strong><p class="hint">${esc(user.email||'Compte connecté')}</p></div></div>
 <form id="profilePhotoForm"><div class="field"><label for="profilePhoto">Photo de profil</label><input id="profilePhoto" type="file" accept="image/png,image/jpeg,image/webp"></div><p class="hint">La photo sera automatiquement réduite pour limiter l’espace utilisé. Taille maximale du fichier d’origine : 5 Mo.</p><p id="profilePhotoError" class="error" role="alert"></p><div class="toolbar"><button class="btn" type="submit">Enregistrer la photo</button><button class="btn secondary" type="button" onclick="removeMyPhoto()">Retirer la photo</button></div></form>
 <hr style="border:0;border-top:1px solid var(--line);margin:26px 0">
 <h3>🔒 Modifier mon mot de passe</h3><p class="hint">Pour ta sécurité, confirme ton mot de passe actuel. Cette option fonctionne pour les comptes créés avec e-mail et mot de passe.</p>
 <form id="profilePasswordForm"><div class="field"><label for="oldProfilePassword">Mot de passe actuel</label><input id="oldProfilePassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newProfilePassword">Nouveau mot de passe</label><input id="newProfilePassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="confirmProfilePassword">Confirmer le nouveau mot de passe</label><input id="confirmProfilePassword" type="password" autocomplete="new-password" minlength="6" required></div><p id="profilePasswordError" class="error" role="alert"></p><div class="toolbar"><button class="btn" type="submit">Changer le mot de passe</button><button class="btn secondary" type="button" onclick="home()">Retour à l’atelier</button></div></form>
 <p class="hint">Ton mot de passe n’est jamais enregistré dans la base de données LePixel ni visible par l’administrateur.</p></section>`;
 document.getElementById('profilePhotoForm').onsubmit=async e=>{
  e.preventDefault();const file=document.getElementById('profilePhoto').files[0],err=document.getElementById('profilePhotoError'),btn=e.submitter;
  if(!file){err.textContent='Choisis une image.';return}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){err.textContent='Format accepté : JPG, PNG ou WEBP.';return}
  if(file.size>5*1024*1024){err.textContent='Cette image dépasse 5 Mo.';return}
  btn.disabled=true;err.textContent='Préparation de la photo…';
  try{
   const data=await lpCompressProfileImage(file);
   if(data.length>180000){throw Error('Image encore trop volumineuse. Choisis une image plus petite.')}
   await db.ref('profileSettings/'+user.uid).update({photoData:data,updatedAt:firebase.database.ServerValue.TIMESTAMP});
   myProfile.photoData=data;alert('Photo de profil mise à jour !');showMyProfile();
  }catch(ex){err.textContent='Enregistrement impossible : '+ex.message}
  finally{btn.disabled=false}
 };
 document.getElementById('profilePasswordForm').onsubmit=async e=>{
  e.preventDefault();const err=document.getElementById('profilePasswordError'),btn=e.submitter;
  const oldPass=document.getElementById('oldProfilePassword').value,newPass=document.getElementById('newProfilePassword').value,confirmPass=document.getElementById('confirmProfilePassword').value;
  if(newPass.length<6){err.textContent='Le nouveau mot de passe doit contenir au moins 6 caractères.';return}
  if(newPass!==confirmPass){err.textContent='Les deux nouveaux mots de passe ne correspondent pas.';return}
  if(newPass===oldPass){err.textContent='Choisis un mot de passe différent de l’ancien.';return}
  if(!user.email){err.textContent='Ce compte ne possède pas d’adresse e-mail utilisable pour cette opération.';return}
  btn.disabled=true;err.textContent='Vérification du compte…';
  try{
   const credential=firebase.auth.EmailAuthProvider.credential(user.email,oldPass);
   await user.reauthenticateWithCredential(credential);
   await user.updatePassword(newPass);
   document.getElementById('profilePasswordForm').reset();
   err.classList.remove('error');err.textContent='Mot de passe modifié avec succès.';err.style.color='#26733b';
  }catch(ex){
   err.classList.add('error');err.style.color='';err.textContent=ex.code==='auth/wrong-password'||ex.code==='auth/invalid-credential'?'Mot de passe actuel incorrect.':ex.code==='auth/weak-password'?'Le nouveau mot de passe est trop faible.':ex.code==='auth/requires-recent-login'?'Reconnecte-toi puis recommence.':'Modification impossible : '+ex.message;
  }finally{btn.disabled=false}
 };
}
function lpCompressProfileImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onerror=()=>reject(Error('Lecture de l’image impossible.'));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Image illisible.'));
   img.onload=()=>{const canvas=document.createElement('canvas'),max=320,scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};
   img.src=reader.result;
  };reader.readAsDataURL(file);
 });
}

}

function openEntry(id){if(isShop()&&closureActive()&&!(user&&(isAdmin()||(privateLoaded&&privateAccess))))return renderClosedShop();let e=entries.find(x=>x.id===id);if(e&&validLink(e.url)){db.ref('stats/'+id+'/clicks').transaction(v=>(v||0)+1).catch(()=>{});window.open(e.url,'_blank','noopener,noreferrer')}}
function showCreate(changeHash=true){if(!allowed('create'))return alert('Accès refusé');if(changeHash)location.hash='creer';app.innerHTML=`<section class="panel"><h2>Nouveau pixel art</h2><p>Ajoute le nom et le lien court de ton pixel art LePixel.</p><form id="createForm"><div class="field"><label>Nom du pixel art</label><input id="name" maxlength="90" placeholder="Ex. Renard en pixel art" required></div><div class="field"><label>Lien du pixel art</label><input id="url" type="url" placeholder="https://frenzifox9.github.io/Ab/#p=..." required></div><p class="hint">Les visiteurs ouvriront ce lien en cliquant sur « Voir le pixel art ».</p><p id="createError" class="error" role="alert"></p><div class="toolbar"><button class="btn" id="saveBtn" type="submit">Publier</button><button class="btn secondary" type="button" onclick="home()">Annuler</button></div></form></section>`;document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),url=document.getElementById('url').value.trim(),err=document.getElementById('createError'),btn=document.getElementById('saveBtn');if(!name||!validLink(url)){err.textContent='Entre un nom et un lien http(s) valide.';return}btn.disabled=true;try{if(!allowed('create'))throw Error('Accès refusé');const ref=db.ref('galleryEntries').push();await ref.set({name,url,createdAt:firebase.database.ServerValue.TIMESTAMP});await logAction('creation',name,ref.key);home()}catch(e){err.textContent='Publication impossible : vérifie les règles Firebase Realtime Database.'}finally{btn.disabled=false}}}
function editEntry(id){
 if(!allowed('edit'))return alert('Accès refusé.');
 const item=entries.find(e=>e.id===id);if(!item)return;
 location.hash='modifier';
 app.innerHTML=`<section class="panel"><h2>Modifier le pixel art</h2><form id="editForm"><div class="field"><label>Nom</label><input id="editName" maxlength="90" required></div><div class="field"><label>Lien</label><input id="editUrl" type="url" required></div><p id="editError" class="error"></p><div class="toolbar"><button class="btn" type="submit">Enregistrer</button><button class="btn secondary" type="button" onclick="home()">Annuler</button></div></form></section>`;
 document.getElementById('editName').value=item.name;
 document.getElementById('editUrl').value=item.url;
 document.getElementById('editForm').onsubmit=async ev=>{
 ev.preventDefault();if(!allowed('edit'))return;
 const name=document.getElementById('editName').value.trim(),url=document.getElementById('editUrl').value.trim();
 if(!name||!validLink(url)){document.getElementById('editError').textContent='Nom ou lien invalide.';return}
 try{await db.ref('history/'+id).push({uid:user.uid,at:firebase.database.ServerValue.TIMESTAMP,previous:{name:item.name,url:item.url},next:{name,url}});await db.ref('galleryEntries/'+id).update({name,url});await logAction('modification',name,id);home()}catch(err){document.getElementById('editError').textContent='Modification refusée : vérifie les règles Firebase.'}
 };
}
function showAccounts(changeHash=true){
 if(!isAdmin())return home();
 if(changeHash)location.hash='comptes';
 const members=Object.entries(roles).map(([uid,r])=>{
 const suspended=r==='suspended_editor'||r==='suspended_viewer';
 const base=suspended?r.replace('suspended_',''):r;
 const title=suspended?'Suspendu ('+(base==='editor'?'Éditeur':'Lecteur')+')':r==='admin'?'Administrateur':r==='editor'?'Éditeur':'Lecteur';
 return `<div class="notice"><b>${esc(accountLabels[uid]||"Compte sans nom")}</b> — ${title}<p class="hint">UID : ${esc(uid)}</p><div class="toolbar"><button class="btn secondary" onclick="renameAccount('${uid}')">✏️ Renommer</button><select aria-label="Rôle" onchange="setRole('${uid}',this.value)" ${suspended?'disabled':''}><option value="admin" ${r==='admin'?'selected':''}>Administrateur</option><option value="editor" ${base==='editor'?'selected':''}>Éditeur</option><option value="viewer" ${base==='viewer'?'selected':''}>Lecteur</option></select>${r==='admin'?'':`<button class="btn secondary" onclick="toggleSuspension('${uid}')">${suspended?'Réactiver':'Suspendre'}</button>`}<button class="btn secondary" onclick="editPermissions('${uid}')">Permissions</button><button class="btn secondary" onclick="removeRole('${uid}')">Retirer</button></div></div>`;
 }).join('');
 app.innerHTML=`<section class="panel"><h2>Gérer les comptes</h2><p>Ajoute un identifiant Firebase UID. Un éditeur peut modifier les pixel arts, un lecteur peut uniquement les consulter.</p><form id="roleForm"><div class="field"><label>Identifiant UID</label><input id="roleUid" required maxlength="128" placeholder="Identifiant Firebase"></div><div class="field"><label>Nom du compte (pour le reconnaître)</label><input id="roleLabel" maxlength="60" required placeholder="Ex. Éditeur Lucas"></div><div class="field"><label>Autorisation</label><select id="roleChoice" style="width:100%;padding:13px"><option value="editor">Éditeur</option><option value="viewer">Lecteur</option><option value="admin">Administrateur</option></select></div><p id="roleError" class="error"></p><div class="toolbar"><button class="btn" type="submit">Ajouter le compte</button><button class="btn secondary" type="button" onclick="home()">Retour</button></div></form><div class="toolbar"><button class="btn secondary" type="button" onclick="showLinkedAccounts()">Associer mes comptes</button><button class="btn secondary" type="button" onclick="managePrivateAccess()">Accès exceptionnel boutique</button></div><h3>Comptes autorisés</h3><div class="notice"><b>${esc(accountLabels[ADMIN_UID]||"Administrateur principal")}</b> — Administrateur principal<p class="hint">UID : ${ADMIN_UID}</p><button class="btn secondary" onclick="renameAccount('${ADMIN_UID}')">✏️ Renommer</button></div>${members}</section>`;
 document.getElementById('roleForm').onsubmit=async ev=>{ev.preventDefault();const uid=document.getElementById('roleUid').value.trim(),r=document.getElementById('roleChoice').value;if(!/^[a-zA-Z0-9]{10,128}$/.test(uid)||uid===ADMIN_UID){document.getElementById('roleError').textContent='Identifiant UID invalide ou déjà administrateur.';return}await setRole(uid,r,document.getElementById('roleLabel').value.trim())};
}
async function setRole(uid,r,label){
 if(!isAdmin()||!['admin','editor','viewer'].includes(r)||uid===ADMIN_UID)return;
 try{
  if(label!==undefined){if(!label||label.length>60)return alert('Entre un nom de 1 à 60 caractères.');await db.ref('accountLabels/'+uid).set(label)}
  await db.ref('accessRoles/'+uid).set(r);await lpSecurityLog('account','Compte ajouté / rôle modifié',uid+' : '+r);showAccounts(false)
 }catch(e){alert('Enregistrement impossible : '+e.message)}
}
async function renameAccount(uid){
 if(!isAdmin()||!(/^[A-Za-z0-9]{10,128}$/.test(uid)))return;
 const name=prompt('Nom pour reconnaître ce compte :',accountLabels[uid]||'');
 if(name===null)return;
 const value=name.trim();if(!value||value.length>60)return alert('Entre un nom de 1 à 60 caractères.');
 try{await db.ref('accountLabels/'+uid).set(value);accountLabels[uid]=value;await lpSecurityLog('account','Compte renommé',uid);showAccounts(false)}catch(e){alert('Impossible de renommer : '+e.message)}
}
async function toggleSuspension(uid){
 if(!isAdmin()||uid===ADMIN_UID)return;
 const current=roles[uid];if(!current||current==='admin')return;
 const next=current.startsWith('suspended_')?current.slice(10):'suspended_'+current;
 if(!['editor','viewer','suspended_editor','suspended_viewer'].includes(next))return;
 if(!current.startsWith('suspended_')&&!confirm('Suspendre ce compte ? Il ne pourra plus accéder à son espace de gestion.'))return;
 try{await db.ref('accessRoles/'+uid).set(next);await lpSecurityLog('account',next.startsWith('suspended_')?'Compte suspendu':'Compte réactivé',uid);showAccounts(false)}catch(e){alert('Impossible de modifier le compte : vérifie les règles Firebase.')}
}
async function removeRole(uid){if(!isAdmin()||uid===ADMIN_UID||!confirm('Retirer ce compte ?'))return;try{await db.ref('accessRoles/'+uid).remove();await db.ref('accountLabels/'+uid).remove();await lpSecurityLog('account','Compte retiré',uid);showAccounts(false)}catch(e){alert('Suppression refusée : vérifie les règles Firebase.')}}
async function deleteEntry(id){if(!allowed('delete'))return alert('Accès refusé.');if(!confirm('Supprimer ce pixel art de la galerie ?'))return;try{await db.ref('galleryEntries/'+id).remove();await logAction('suppression',id,id)}catch(e){alert('Suppression refusée : vérifie les règles Firebase.')}}

async function logAction(action,detail,id=''){if(!user)return;try{await db.ref('activity').push({action,detail:String(detail).slice(0,200),id,uid:user.uid,at:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn('Journal:',e.message)}}
function dashboard(changeHash=true){if(!user)return showLogin();if(changeHash)location.hash='dashboard';let total=Object.values(stats).reduce((n,v)=>n+(v.views||0),0), clicks=Object.values(stats).reduce((n,v)=>n+(v.clicks||0),0);app.innerHTML=`<section class="panel" style="max-width:950px"><h2>Tableau de bord</h2><div class="metric-grid"><div class="metric"><strong>${entries.length}</strong><span>Pixel arts</span></div><div class="metric"><strong>${total}</strong><span>Vues de la boutique</span></div><div class="metric"><strong>${clicks}</strong><span>Ouvertures des liens</span></div><div class="metric"><strong>${Object.keys(scheduled).length}</strong><span>Programmations</span></div></div><div class="toolbar">${allowed('stats')?'<button class="btn secondary" onclick="showStats()">Statistiques</button>':''}${allowed('history')?'<button class="btn secondary" onclick="showHistory()">Historique</button>':''}${allowed('activity')?'<button class="btn secondary" onclick="showActivity()">Journal d’activité</button>':''}${allowed('announce')?'<button class="btn secondary" onclick="editAnnouncement()">Annonces</button>':''}<button class="btn secondary" onclick="showMyProfile()">👤 Mon profil</button>${isAdmin()?'<button class="btn secondary" onclick="showAccounts()">Comptes</button><button class="btn secondary" onclick="manageClosure()">Fermer / rouvrir boutique</button><button class="btn secondary" onclick="managePrivateAccess()">Accès exceptionnel</button><button class="btn secondary" onclick="showLinkedAccounts()">Comptes associés</button>':''}${isAdmin()?'<button class="btn secondary" onclick="showIdeas()">Boîte à idées</button><button class="btn secondary" onclick="showAppearance()">Personnaliser boutique</button>':''}${isAdmin()?'<button class="btn secondary" onclick="showLogins()">Journal des connexions</button><button class="btn secondary" onclick="showSupportAdmin()">🎧 Tickets d’assistance</button><button class="btn secondary" onclick="showVisitorManagement()">👥 Visiteurs / connexions / messagerie</button><button class="btn secondary" onclick="showMonitor()">📡 Surveillance du site</button><button class="btn secondary" onclick="showNotifications()">🔔 Notifications</button><button class="btn secondary" onclick="showSecurityJournal()">🛡️ Journal de sécurité</button>':''}<button class="btn" onclick="home()">Retour</button></div><h3>Brouillons sur cet appareil</h3><div class="toolbar">${allowed('create')?'<button class="btn secondary" onclick="newDraft()">+ Nouveau brouillon</button>':''}</div>${getDrafts().map((d,i)=>`<div class="notice"><b>${esc(d.name)}</b><p class="hint">${esc(d.url)}</p><div class="toolbar"><button class="btn secondary" onclick="editDraft(${i})">Modifier</button><button class="btn secondary" onclick="publishDraft(${i})">Publier</button><button class="btn secondary" onclick="deleteDraft(${i})">Supprimer</button></div></div>`).join('')||'<p>Aucun brouillon.</p>'}</section>`}
function getDrafts(){try{return JSON.parse(localStorage.getItem('lepixel_gallery_drafts_'+(user?.uid||''))||'[]')}catch{return []}}
function setDrafts(v){localStorage.setItem('lepixel_gallery_drafts_'+user.uid,JSON.stringify(v))}
function newDraft(){if(!allowed('create'))return;const name=prompt('Nom du brouillon');if(!name)return;const url=prompt('Lien du pixel art (facultatif)')||'';setDrafts([...getDrafts(),{name,url}]);dashboard(false)}
function editDraft(i){const d=getDrafts(),name=prompt('Nom',d[i].name);if(name===null)return;const url=prompt('Lien',d[i].url);if(url===null)return;d[i]={name,url};setDrafts(d);dashboard(false)}
function deleteDraft(i){const d=getDrafts();d.splice(i,1);setDrafts(d);dashboard(false)}
async function publishDraft(i){if(!allowed('create'))return;const d=getDrafts(),v=d[i];if(!v||!validLink(v.url))return alert('Ajoute un lien valide au brouillon.');try{const ref=db.ref('galleryEntries').push();await ref.set({name:v.name,url:v.url,createdAt:firebase.database.ServerValue.TIMESTAMP});await logAction('publication brouillon',v.name,ref.key);d.splice(i,1);setDrafts(d);home()}catch(e){alert(e.message)}}
function showStats(){if(!allowed('stats'))return;app.innerHTML=`<section class="panel"><h2>Statistiques</h2><p class="hint">Compteurs indicatifs depuis l’activation de cette version. Les ouvertures de liens ne comptent pas les téléchargements effectués sur l’autre site.</p>${entries.map(e=>`<div class="notice"><b>${esc(e.name)}</b><p>${stats[e.id]?.views||0} affichages · ${stats[e.id]?.clicks||0} ouvertures</p></div>`).join('')}<button class="btn" onclick="dashboard()">Retour</button></section>`}
function showActivity(){if(!allowed('activity'))return;app.innerHTML=`<section class="panel"><h2>Journal d’activité</h2>${activity.slice(-100).reverse().map(a=>`<div class="notice"><b>${esc(a.action)}</b> — ${esc(a.uid)}<p>${esc(a.detail||'')} · ${a.at?new Date(a.at).toLocaleString('fr-FR'):''}</p></div>`).join('')||'<p>Aucune activité enregistrée.</p>'}<button class="btn" onclick="dashboard()">Retour</button></section>`}
function showHistory(){if(!allowed('history'))return;app.innerHTML=`<section class="panel"><h2>Historique des modifications</h2>${historyItems.slice(-100).reverse().map(h=>`<div class="notice"><b>${esc(h.previous?.name||'Pixel art')}</b><p>${esc(h.uid)} · ${h.at?new Date(h.at).toLocaleString('fr-FR'):''}</p><p>Avant : ${esc(h.previous?.url||'')}<br>Après : ${esc(h.next?.url||'')}</p></div>`).join('')||'<p>Aucune modification enregistrée.</p>'}<button class="btn" onclick="dashboard()">Retour</button></section>`}
function editAnnouncement(){if(!allowed('announce'))return;app.innerHTML=`<section class="panel"><h2>Annonces</h2><p>Ce message apparaît en haut de la boutique publique.</p><textarea id="announceText" maxlength="300" rows="4" style="width:100%;padding:12px"></textarea><div class="toolbar"><button class="btn" onclick="saveAnnouncement(true)">Publier</button><button class="btn secondary" onclick="saveAnnouncement(false)">Masquer</button><button class="btn secondary" onclick="dashboard()">Retour</button></div></section>`;document.getElementById('announceText').value=announcement.text||''}
async function saveAnnouncement(active){if(!allowed('announce'))return;try{await db.ref('announcements/main').set({text:document.getElementById('announceText').value.trim(),active});await logAction('annonce',active?'publiée':'masquée');await lpSecurityLog('shop',active?'Annonce publiée':'Annonce masquée','');dashboard()}catch(e){alert('Enregistrement impossible : '+e.message)}}
function editPermissions(uid){if(!isAdmin())return;app.innerHTML=`<section class="panel"><h2>Autorisations personnalisées</h2><p class="hint">${esc(uid)}</p><form id="permForm">${Object.entries(permLabels).map(([k,v])=>`<label style="display:block;margin:14px 0"><input style="width:auto" type="checkbox" name="${k}" ${permissions[uid]?.[k]?'checked':''}> ${v}</label>`).join('')}<div class="toolbar"><button class="btn">Enregistrer</button><button class="btn secondary" type="button" onclick="showAccounts()">Retour</button></div></form></section>`;document.getElementById('permForm').onsubmit=async e=>{e.preventDefault();const obj={};for(const k of Object.keys(permLabels))obj[k]=document.querySelector('[name="'+k+'"]').checked;try{await db.ref('permissions/'+uid).set(obj);await logAction('permissions',uid);await lpSecurityLog('account','Permissions modifiées',uid);showAccounts()}catch(e){alert(e.message)}}}
async function scheduleEntry(id){if(!allowed('schedule'))return;const entry=entries.find(e=>e.id===id);if(!entry)return;const value=prompt('Date et heure de publication (AAAA-MM-JJ HH:MM)');if(!value)return;const at=new Date(value.replace(' ','T')).getTime();if(!Number.isFinite(at)||at<=Date.now())return alert('Date future invalide');try{await db.ref('scheduled/'+id).set({at});await logAction('programmation',entry.name,id);alert('Programmé. La carte sera visible après cette date, lorsque la boutique sera rechargée.');home()}catch(e){alert(e.message)}}

// === LePixel : assistance ===
const lpMonitor={online:navigator.onLine,connected:null,errors:[],lastCheck:0};
function lpSafeError(e){return String(e&&e.message||e||'Erreur inconnue').slice(0,220)}
function lpTrack(kind,detail){lpMonitor.errors.unshift({kind:String(kind).slice(0,50),detail:String(detail).slice(0,220),at:Date.now()});lpMonitor.errors=lpMonitor.errors.slice(0,60);}
window.addEventListener('online',()=>{lpMonitor.online=true;lpTrack('Réseau','Connexion Internet rétablie')});
window.addEventListener('offline',()=>{lpMonitor.online=false;lpTrack('Réseau','Connexion Internet perdue')});
window.addEventListener('error',e=>lpTrack('JavaScript',e.message||'Erreur de script'));
window.addEventListener('unhandledrejection',e=>lpTrack('Promesse',lpSafeError(e.reason)));
function lpTicketIdOK(v){return /^[-A-Za-z0-9_]{18,40}$/.test(v||'')}
function lpSupportLanding(){if(lpBlocked)return showVisitorChat(),false;if(isShop()&&closureActive()&&!(user&&(isAdmin()||(privateLoaded&&privateAccess))))return renderClosedShop();return true}
function showSupportForm(){if(!lpSupportLanding())return;app.innerHTML=`<section class="panel"><h2>🎧 Centre d'assistance</h2><p>Un problème avec LePixel ? Envoie un ticket. Ne communique jamais de mot de passe ou d'information personnelle.</p><form id="lpHelpForm"><div class="field"><label for="lpHelpType">Type de problème</label><select id="lpHelpType" style="width:100%"><option>Téléchargement impossible</option><option>Lien qui ne fonctionne pas</option><option>Problème d'affichage</option><option>Problème de compte</option><option>Autre</option></select></div><div class="field"><label for="lpHelpText">Décris le problème</label><textarea id="lpHelpText" rows="5" maxlength="700" required style="width:100%" placeholder="Que se passe-t-il ?"></textarea></div><p id="lpHelpError" class="error"></p><div class="toolbar"><button class="btn" type="submit">Envoyer le ticket</button><button class="btn secondary" type="button" onclick="showSupportLookup()">Suivre un ticket</button><button class="btn secondary" type="button" onclick="lpReturnShop()">Retour</button></div></form></section>`;document.getElementById('lpHelpForm').onsubmit=async ev=>{ev.preventDefault();const category=document.getElementById('lpHelpType').value,text=document.getElementById('lpHelpText').value.trim(),btn=ev.submitter;if(text.length<10){document.getElementById('lpHelpError').textContent='Décris ton problème avec au moins 10 caractères.';return}btn.disabled=true;try{const ref=db.ref('supportTickets').push();await ref.set({visitorId:lpVisitor,category,text,status:'open',createdAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP});app.innerHTML=`<section class="panel"><h2>Ticket envoyé !</h2><p>Conserve cet identifiant privé pour consulter la réponse. Ne le partage pas publiquement.</p><div class="notice" id="lpTicketKey">${esc(ref.key)}</div><div class="toolbar"><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('lpTicketKey').textContent).then(()=>alert('Identifiant copié')).catch(()=>prompt('Copie cet identifiant :',document.getElementById('lpTicketKey').textContent))">Copier l'identifiant</button><button class="btn secondary" onclick="showSupportTicket('${ref.key}')">Suivre ce ticket</button><button class="btn secondary" onclick="lpReturnShop()">Retour boutique</button></div></section>`}catch(e){lpTrack('Assistance',lpSafeError(e));document.getElementById('lpHelpError').textContent='Envoi impossible : '+lpSafeError(e);btn.disabled=false}}}
function showSupportLookup(){if(!lpSupportLanding())return;app.innerHTML=`<section class="panel"><h2>Suivre mon ticket</h2><p>Entre l'identifiant privé reçu lors de la création du ticket.</p><form id="lpLookup"><div class="field"><label for="lpLookupId">Identifiant du ticket</label><input id="lpLookupId" required maxlength="40" autocomplete="off"></div><p class="error" id="lpLookupError"></p><div class="toolbar"><button class="btn">Rechercher</button><button type="button" class="btn secondary" onclick="lpReturnShop()">Retour</button></div></form></section>`;document.getElementById('lpLookup').onsubmit=e=>{e.preventDefault();const id=document.getElementById('lpLookupId').value.trim();if(!lpTicketIdOK(id)){document.getElementById('lpLookupError').textContent='Identifiant invalide.';return}showSupportTicket(id)}}
async function showSupportTicket(id){if(!lpSupportLanding())return;if(!lpTicketIdOK(id))return showSupportLookup();app.innerHTML='<section class="panel"><h2>Suivi du ticket</h2><p>Chargement…</p></section>';try{const snap=await db.ref('supportTickets/'+id).once('value'),v=snap.val();if(!v)throw Error('Ticket introuvable');const replies=Object.values(v.replies||{}).sort((a,b)=>(a.at||0)-(b.at||0));app.innerHTML=`<section class="panel"><h2>Ticket d'assistance</h2><p class="hint">Identifiant privé : ${esc(id)}</p><div class="notice"><b>${esc(v.category)}</b><p>${esc(v.text)}</p><p class="hint">Statut : ${esc(v.status==='resolved'?'Résolu':v.status==='progress'?'En cours':'Ouvert')}</p></div><h3>Réponses de l'équipe</h3>${replies.map(r=>`<div class="notice"><p>${esc(r.text)}</p><p class="hint">${r.at?new Date(r.at).toLocaleString('fr-FR'):''}</p></div>`).join('')||'<p>Aucune réponse pour le moment.</p>'}<div class="toolbar"><button class="btn secondary" onclick="showSupportTicket('${id}')">Actualiser</button><button class="btn secondary" onclick="lpReturnShop()">Retour boutique</button></div></section>`}catch(e){app.innerHTML=`<section class="panel"><h2>Ticket indisponible</h2><p>${esc(lpSafeError(e))}</p><button class="btn secondary" onclick="showSupportLookup()">Réessayer</button></section>`}}
async function showSupportAdmin(){if(!isAdmin())return home();app.innerHTML='<section class="panel"><h2>Tickets d’assistance</h2><p>Chargement…</p></section>';try{const snap=await db.ref('supportTickets').once('value'),list=Object.entries(snap.val()||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));app.innerHTML=`<section class="panel" style="max-width:980px"><h2>🎧 Tickets d'assistance</h2><p>Demandes des visiteurs. Ne demande jamais leur mot de passe.</p>${list.map(([id,v])=>`<div class="lp-ticket"><b>${esc(v.category||'Autre')}</b> ${/^[a-f0-9]{32}$/.test(v.visitorId||'')?`<button class="btn secondary" onclick="showAdminVisitorChat('${v.visitorId}')">💬 Contacter le visiteur</button>`:''} <span class="lp-status ${v.status==='resolved'?'': 'lp-warn'}">${esc(v.status==='resolved'?'Résolu':v.status==='progress'?'En cours':'Ouvert')}</span><p>${esc(v.text||'')}</p><p class="hint">${v.createdAt?new Date(v.createdAt).toLocaleString('fr-FR'):''} · ${esc(id)}</p><label>Statut</label><select id="lpStatus_${id}"><option value="open" ${v.status==='open'?'selected':''}>Ouvert</option><option value="progress" ${v.status==='progress'?'selected':''}>En cours</option><option value="resolved" ${v.status==='resolved'?'selected':''}>Résolu</option></select><div class="toolbar"><button class="btn secondary" onclick="lpUpdateStatus('${id}')">Enregistrer statut</button><button class="btn secondary" style="border-color:#a32a32;color:#a32a32" onclick="lpDeleteTicket('${id}')">🗑️ Supprimer le ticket</button></div><div class="lp-messages">${Object.values(v.replies||{}).sort((a,b)=>(a.at||0)-(b.at||0)).map(r=>`<div class="notice">${esc(r.text)}<p class="hint">${r.at?new Date(r.at).toLocaleString('fr-FR'):''}</p></div>`).join('')}</div><label for="lpReply_${id}">Réponse</label><textarea id="lpReply_${id}" rows="2" maxlength="700" placeholder="Écris ta réponse…"></textarea><div class="toolbar"><button class="btn" onclick="lpReply('${id}')">Envoyer la réponse</button></div></div>`).join('')||'<div class="empty">Aucun ticket pour le moment.</div>'}<div class="toolbar"><button class="btn secondary" onclick="showSupportAdmin()">Actualiser</button><button class="btn secondary" onclick="dashboard()">Retour</button></div></section>`}catch(e){lpTrack('Assistance',lpSafeError(e));app.innerHTML=`<section class="panel"><h2>Lecture impossible</h2><p class="error">${esc(lpSafeError(e))}</p><button class="btn secondary" onclick="dashboard()">Retour</button></section>`}}
async function lpUpdateStatus(id){if(!isAdmin())return;try{await db.ref('supportTickets/'+id).update({status:document.getElementById('lpStatus_'+id).value,updatedAt:firebase.database.ServerValue.TIMESTAMP});showSupportAdmin()}catch(e){lpTrack('Assistance',lpSafeError(e));alert(lpSafeError(e))}}
async function lpDeleteTicket(id){
 if(!isAdmin()||!lpTicketIdOK(id))return;
 if(!confirm('Supprimer définitivement ce ticket et toutes ses réponses ? Cette action est irréversible.'))return;
 try{
  await db.ref('supportTickets/'+id).remove();
  await logAction('suppression ticket assistance',id);
  if(typeof lpSecurityLog==='function'){
   try{await lpSecurityLog('suppression_ticket','Ticket supprimé : '+id)}catch(e){console.warn('Journal de sécurité :',e.message)}
  }
  await showSupportAdmin();
 }catch(e){lpTrack('Assistance',lpSafeError(e));alert('Suppression impossible : '+lpSafeError(e))}
}
async function lpReply(id){if(!isAdmin())return;const text=document.getElementById('lpReply_'+id).value.trim();if(!text)return;try{await db.ref('supportTickets/'+id+'/replies').push({text,at:firebase.database.ServerValue.TIMESTAMP,by:user.uid});await db.ref('supportTickets/'+id).update({status:'progress',updatedAt:firebase.database.ServerValue.TIMESTAMP});showSupportAdmin()}catch(e){lpTrack('Assistance',lpSafeError(e));alert(lpSafeError(e))}}
// === LePixel : surveillance de session (pas de contrôle 24/7) ===
function lpMonitorInit(){db.ref('.info/connected').on('value',s=>{lpMonitor.connected=s.val()===true;lpMonitor.lastCheck=Date.now();if(lpMonitor.connected===false)lpTrack('Firebase','Connexion Realtime Database interrompue')},e=>lpTrack('Firebase',lpSafeError(e)))}
function showMonitor(){if(!isAdmin())return home();const errors=lpMonitor.errors;app.innerHTML=`<section class="panel" style="max-width:1000px"><h2>📡 Surveillance du site</h2><p>État détecté sur <b>cet appareil</b> pendant cette session. Les autres visiteurs et les périodes où le site est fermé ne sont pas surveillés automatiquement.</p><div class="lp-grid" style="margin:22px 0"><div class="lp-box"><h3>Internet</h3><span class="lp-status ${lpMonitor.online?'':'lp-danger'}">${lpMonitor.online?'En ligne':'Hors ligne'}</span></div><div class="lp-box"><h3>Firebase</h3><span class="lp-status ${lpMonitor.connected===true?'':lpMonitor.connected===false?'lp-danger':'lp-warn'}">${lpMonitor.connected===true?'Connecté':lpMonitor.connected===false?'Déconnecté':'Non vérifié'}</span></div><div class="lp-box"><h3>Incidents de session</h3><strong style="font-size:2rem">${errors.length}</strong></div><div class="lp-box"><h3>Boutique</h3><span class="lp-status ${closureLoaded?'':'lp-warn'}">${!closureLoaded?'Statut inconnu':closureActive()?'Fermée volontairement':'Ouverture prévue'}</span></div></div><h3>Erreurs détectées sur cet appareil</h3>${errors.map(e=>`<div class="notice"><b>${esc(e.kind)}</b><p>${esc(e.detail)}</p><p class="hint">${new Date(e.at).toLocaleString('fr-FR')}</p></div>`).join('')||'<p>Aucune erreur détectée pendant cette session.</p>'}<p class="hint">Les liens externes ne peuvent pas tous être testés automatiquement depuis un navigateur. Aucun contrôle de disponibilité permanent n'est fourni.</p><div class="toolbar"><button class="btn secondary" onclick="showMonitor()">Actualiser</button><button class="btn secondary" onclick="lpMonitor.errors=[];showMonitor()">Effacer les incidents locaux</button><button class="btn secondary" onclick="dashboard()">Retour</button></div></section>`}


// === Notifications administrateur et journal de sécurité ===
function lpTime(at){return at?new Date(at).toLocaleString('fr-FR'):'Date indisponible'}
function lpActor(uid){return accountLabels[uid]||uid||'Système'}
async function lpSecurityLog(kind,title,detail=''){
 if(!isAdmin())return;
 try{await db.ref('securityJournal').push({kind,title,detail:String(detail).slice(0,180),uid:user.uid,at:firebase.database.ServerValue.TIMESTAMP})}
 catch(e){console.warn('Journal de sécurité indisponible :',e.message);lpTrack('Sécurité',lpSafeError(e))}
}
function lpNotifBuild(tickets,ideas,events){
 const all=[];
 Object.entries(tickets||{}).forEach(([id,v])=>{if(v&&v.createdAt)all.push({id:'ticket_'+id,at:v.createdAt,title:'Nouveau ticket d’assistance',detail:String(v.category||'Demande reçue'),page:'tickets'})});
 Object.entries(ideas||{}).forEach(([id,v])=>{if(v&&v.createdAt)all.push({id:'idea_'+id,at:v.createdAt,title:'Nouvelle idée',detail:String(v.title||'Proposition reçue'),page:'ideas'})});
 Object.entries(events||{}).forEach(([id,v])=>{if(v&&v.at)all.push({id:'security_'+id,at:v.at,title:String(v.title||'Événement de sécurité'),detail:String(v.detail||''),page:'security'})});
 lpNotifItems=all.sort((a,b)=>b.at-a.at).slice(0,300);lpNotifRefreshBadge();
}
let lpTicketCache={},lpIdeaCache={};
function lpNotifRefreshBadge(){const count=lpNotifItems.filter(n=>!lpNotificationReads[n.id]).length;const el=document.getElementById('lpUnread');if(el){el.textContent=count>99?'99+':String(count);el.classList.toggle('hidden',count===0)}}
function lpNotifStop(){lpNotifRefs.forEach(ref=>ref.off());lpNotifRefs=[];lpNotifItems=[];lpSecurityEvents={};lpNotificationReads={};lpTicketCache={};lpIdeaCache={};lpNotifRefreshBadge()}
function lpNotifStart(){lpNotifStop();if(!isAdmin())return;
 const listen=(path,cb)=>{const ref=db.ref(path);ref.on('value',snap=>cb(snap.val()||{}),e=>lpTrack('Notifications',lpSafeError(e)));lpNotifRefs.push(ref)};
 listen('supportTickets',v=>{lpTicketCache=v;lpNotifBuild(lpTicketCache,lpIdeaCache,lpSecurityEvents)});
 listen('ideas',v=>{lpIdeaCache=v;lpNotifBuild(lpTicketCache,lpIdeaCache,lpSecurityEvents)});
 listen('securityJournal',v=>{lpSecurityEvents=v;lpNotifBuild(lpTicketCache,lpIdeaCache,lpSecurityEvents)});
 listen('notificationReads/'+user.uid,v=>{lpNotificationReads=v;lpNotifRefreshBadge()});
}
async function lpMarkRead(id){if(!isAdmin())return;try{await db.ref('notificationReads/'+user.uid+'/'+id).set(true);lpNotificationReads[id]=true;lpNotifRefreshBadge()}catch(e){alert('Impossible de marquer la notification : '+lpSafeError(e))}}
async function lpMarkAllRead(){if(!isAdmin())return;const updates={};lpNotifItems.filter(n=>!lpNotificationReads[n.id]).forEach(n=>updates[n.id]=true);if(!Object.keys(updates).length)return;try{await db.ref('notificationReads/'+user.uid).update(updates);showNotifications()}catch(e){alert(lpSafeError(e))}}
async function lpOpenNotification(id){const n=lpNotifItems.find(x=>x.id===id);if(!n)return;await lpMarkRead(id);if(n.page==='tickets')showSupportAdmin();else if(n.page==='ideas')showIdeas();else showSecurityJournal()}
function showNotifications(){if(!isAdmin())return home();const unread=lpNotifItems.filter(n=>!lpNotificationReads[n.id]).length;app.innerHTML=`<section class="panel" style="max-width:940px"><h2>🔔 Notifications administrateur</h2><p>${unread} non lue(s). Les nouvelles demandes et actions sont synchronisées avec Firebase.</p><div class="toolbar"><button class="btn secondary" onclick="lpMarkAllRead()">Tout marquer comme lu</button><button class="btn secondary" onclick="dashboard()">Retour</button></div>${lpNotifItems.map(n=>`<div class="lp-event"><b>${lpNotificationReads[n.id]?'':'🔵 '}${esc(n.title)}</b><p>${esc(n.detail)}</p><p class="hint">${lpTime(n.at)}</p><button class="btn secondary" onclick="lpOpenNotification('${n.id}')">${lpNotificationReads[n.id]?'Ouvrir':'Lire et ouvrir'}</button></div>`).join('')||'<div class="empty">Aucune notification.</div>'}</section>`}
function showSecurityJournal(filter='all'){if(!isAdmin())return home();const entries=Object.entries(lpSecurityEvents).map(([id,v])=>({...v,id})).filter(v=>filter==='all'||v.kind===filter).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,200);app.innerHTML=`<section class="panel" style="max-width:950px"><h2>🛡️ Journal de sécurité</h2><p>Actions importantes effectuées depuis LePixel. Les changements directement dans Firebase ne sont pas enregistrés ici.</p><div class="toolbar"><select id="lpSecurityFilter" onchange="showSecurityJournal(this.value)"><option value="all" ${filter==='all'?'selected':''}>Tous les événements</option><option value="account" ${filter==='account'?'selected':''}>Comptes et permissions</option><option value="shop" ${filter==='shop'?'selected':''}>Boutique</option><option value="security" ${filter==='security'?'selected':''}>Sécurité</option></select><button class="btn secondary" onclick="dashboard()">Retour</button></div>${entries.map(v=>`<div class="lp-event"><b>${esc(v.title)}</b><p>${esc(v.detail||'')}</p><p class="hint">${esc(lpActor(v.uid))} · ${lpTime(v.at)}</p></div>`).join('')||'<div class="empty">Aucun événement enregistré.</div>'}<p class="hint">Journal informatif : les actions effectuées avant l'installation ne sont pas récupérées.</p></section>`}

function watchFeatures(){const paths=[['accountLabels',v=>{accountLabels=v||{};}],['shopSettings/appearance',v=>{appearance=v||{title:'Mes pixel arts',subtitle:'Choisis une création pour découvrir son pixel art.',accent:'#c8f169',banner:''};appearanceLoaded=true;applyAppearance();if(isShop())render()}],['shopSettings/closure',v=>{shopClosure=v||{active:false};closureLoaded=true;closureError=false;if(isShop())render()}],['permissions',v=>permissions=v||{}],['announcements/main',v=>{announcement=v||{};if(isShop())render()}],['stats',v=>stats=v||{}],['activity',v=>activity=Object.values(v||{})],['history',v=>{historyItems=[];Object.values(v||{}).forEach(group=>historyItems.push(...Object.values(group||{})))}],['scheduled',v=>{scheduled=v||{};scheduledLoaded=true;if(isShop())render()}]];for(const [path,cb] of paths)db.ref(path).on('value',snap=>cb(snap.val()),e=>{console.warn('Lecture '+path,e.message);lpTrack('Firebase / '+path,lpSafeError(e));if(path==='shopSettings/closure'){closureLoaded=false;closureError=true;if(isShop())render()}if(path==='scheduled'){scheduledLoaded=false;if(isShop())app.innerHTML='<section class="panel"><h2>Nouveautés indisponibles</h2><p>Impossible de vérifier les dates de publication.</p></section>'}})}

// Preserve public subpages when Firebase sends live updates (e.g. view counters).
function lpOpenPublicPage(fn){return function(...args){const result=fn.apply(this,args);if(isShop()&&!lpBlocked)app.dataset.lpSubpage='yes';return result}}
for(const name of ['showFavorites','showIdeaForm','showVisitorChat','showSupportForm','showSupportLookup','showSupportTicket']){
 const original=window[name];if(typeof original==='function')window[name]=lpOpenPublicPage(original);
}
function lpReturnShop(){delete app.dataset.lpSubpage;render()}
try{firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();lpMonitorInit();lpVisitorBoot();auth.onAuthStateChanged(u=>{authReady=true;lpNotifStop();lpSecurityReady=false;user=u;if(u){const labelRef=db.ref(u.uid===ADMIN_UID?'accountLabels':'accountLabels/'+u.uid);labelRef.once('value').then(s=>{accountLabels=u.uid===ADMIN_UID?(s.val()||{}):{...accountLabels,[u.uid]:s.val()||''};if(location.hash==='#comptes')showAccounts(false);if(user&&user.uid===u.uid&&!isShop())render()}).catch(()=>{});loadMyProfile().then(()=>{if(user&&user.uid===u.uid&&!isShop())render()});}else{accountLabels={};myProfile={photoData:''};myProfileReady=false;}roles={};rolesLoaded=false;privateLoaded=false;privateAccess=false;if(window.privateRef)window.privateRef.off();if(u){window.privateRef=db.ref('shopSettings/allowedVisitors/'+u.uid);window.privateRef.on('value',snap=>{privateAccess=snap.val()===true;privateLoaded=true;if(isShop())render()},()=>{privateLoaded=true;privateAccess=false;if(isShop())render()})}else{privateLoaded=true;} if(window.rolesRef)window.rolesRef.off();if(u){window.rolesRef=db.ref('accessRoles');window.rolesRef.on('value',snap=>{roles=snap.val()||{};rolesLoaded=true;if(isAdmin()){if(lpSecurityReady!==u.uid){lpSecurityReady=u.uid;lpNotifStart()}}else{lpSecurityReady=false;lpNotifStop()}render()},err=>{console.error('Permissions indisponibles',err);rolesLoaded=false;render()})}render()});watchFeatures();db.ref('galleryEntries').on('value',snap=>{entries=[];snap.forEach(child=>{let v=child.val();if(v&&typeof v.name==='string'&&validLink(v.url))entries.push({id:child.key,name:v.name,url:v.url,createdAt:v.createdAt||0})});entries.sort((a,b)=>b.createdAt-a.createdAt);render()},err=>{app.innerHTML='<section class="panel"><h2>Chargement impossible</h2><p>La lecture de la galerie est bloquée. Vérifie les règles Firebase.</p></section>'})}catch(e){console.error(e)}
function showLogin(changeHash=true){
 if(isShop())return render();
 if(changeHash)location.hash='connexion';
 app.innerHTML=`<section class="panel"><h2>Connexion à la boutique</h2><p>Connecte-toi avec ton compte Firebase pour gérer la boutique. Tes abonnés n'ont pas besoin de compte.</p><form id="loginForm"><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><p id="loginError" class="error" role="alert"></p><div class="toolbar"><button class="btn" type="submit">Se connecter</button><button class="btn secondary" type="button" onclick="shareShop()">Partager la boutique</button></div></form></section>`;
 document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='';try{const result=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);if(result.user.uid!==ADMIN_UID){try{const snap=await db.ref('accessRoles/'+result.user.uid).once('value');if(!['admin','editor','viewer'].includes(snap.val())){await auth.signOut();err.textContent='Ce compte n’est pas autorisé à gérer cette boutique.';return}}catch(ex){err.textContent='Impossible de vérifier les autorisations Firebase.';return}}await logLogin();await chooseLinkedAccount()}catch(ex){err.textContent='Connexion impossible. Vérifie ton e-mail, ton mot de passe et la méthode de connexion Firebase.'}};
}
async function logout(){await auth.signOut();home()}
closureTimer=setInterval(updateClosureCountdown,1000);window.addEventListener('hashchange',()=>{delete app.dataset.lpSubpage;if(isShop()&&closureLoaded&&!closureActive())for(const e of entries)db.ref('stats/'+e.id+'/views').transaction(v=>(v||0)+1).catch(()=>{});render()});render();
</script></body></html>
